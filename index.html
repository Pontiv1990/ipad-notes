<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- iOS Home Screen standalone mode: hides Safari chrome.
         iOS still keeps its system status bar; black-translucent lets the app background extend underneath it. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WRITING">

    <title>WRITING</title>

    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #898989;
            overflow: hidden;
            font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        .app-container {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -webkit-flex-direction: column;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .toolbar {
            background-color: rgba(40, 40, 40, 0.94);
            color: #fff;
            padding: 28px 12px 10px 12px;
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: center;
            justify-content: center;
            -webkit-flex-wrap: wrap;
            flex-wrap: wrap;
            font-size: 13px;
            z-index: 10;
            border-bottom: 1px solid rgba(255,255,255,0.18);
            overflow: hidden;
            max-height: 380px;
            -webkit-transition: max-height 0.25s ease, padding 0.25s ease;
            transition: max-height 0.25s ease, padding 0.25s ease;
        }

        .toolbar.hidden {
            max-height: 0;
            padding: 0 12px;
            border-bottom: none;
        }

        .setting-item {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            margin: 4px 6px;
        }

        .setting-item label {
            margin-right: 6px;
            font-size: 12px;
            color: #ddd;
            white-space: nowrap;
        }

        select,
        input[type="color"] {
            background-color: #333;
            color: #fff;
            border: 1px solid #666;
            border-radius: 4px;
            padding: 4px 6px;
            font-size: 13px;
            outline: none;
        }

        input[type="color"] {
            width: 110px;
            min-width: 110px;
            height: 32px;
            padding: 4px 6px;
            font-family: "Courier New", Courier, monospace;
            font-size: 14px;
        }

        /* Invisible hot corner: tap the upper-right area to show/hide settings. */
        .toggle-btn {
            position: absolute;
            top: 20px;
            right: 0;
            z-index: 20;
            width: 56px;
            height: 56px;
            padding: 0;
            margin: 0;
            border: 0;
            background: transparent;
            outline: none;
            -webkit-appearance: none;
        }

        #editor {
            -webkit-box-flex: 1;
            -webkit-flex: 1;
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            resize: none;
            background-color: transparent;
            color: #000000;
            font-size: 20px;
            line-height: 1.5;
            padding-top: 50px;
            padding-bottom: 50px;
            padding-left: 16px;
            padding-right: 16px;
            font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
            text-align: justify;
            -webkit-appearance: none;
        }
    </style>
</head>
<body>

    <button class="toggle-btn" id="toggleBtn" aria-label="Settings"></button>

    <div class="app-container">
        <div class="toolbar hidden" id="toolbar">

            <div class="setting-item">
                <label for="fontFamily">Font</label>
                <select id="fontFamily">
                    <option value="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">System</option>
                    <option value="'Academy Engraved LET', serif">Academy Engraved LET</option>
                    <option value="'American Typewriter', serif">American Typewriter</option>
                    <option value="Arial, sans-serif">Arial</option>
                    <option value="'Arial Rounded MT Bold', Arial, sans-serif">Arial Rounded MT Bold</option>
                    <option value="Avenir, sans-serif">Avenir</option>
                    <option value="'Avenir Next', sans-serif">Avenir Next</option>
                    <option value="'Avenir Next Condensed', sans-serif">Avenir Next Condensed</option>
                    <option value="Baskerville, serif">Baskerville</option>
                    <option value="'Bodoni 72', serif">Bodoni 72</option>
                    <option value="'Bodoni 72 Oldstyle', serif">Bodoni 72 Oldstyle</option>
                    <option value="'Bodoni 72 Smallcaps', serif">Bodoni 72 Smallcaps</option>
                    <option value="'Bradley Hand', cursive">Bradley Hand</option>
                    <option value="'Chalkboard SE', cursive">Chalkboard SE</option>
                    <option value="Chalkduster, cursive">Chalkduster</option>
                    <option value="Cochin, serif">Cochin</option>
                    <option value="Copperplate, serif">Copperplate</option>
                    <option value="Courier, monospace">Courier</option>
                    <option value="'Courier New', Courier, monospace">Courier New</option>
                    <option value="Didot, serif">Didot</option>
                    <option value="'Euphemia UCAS', sans-serif">Euphemia UCAS</option>
                    <option value="Futura, sans-serif">Futura</option>
                    <option value="Georgia, serif">Georgia</option>
                    <option value="'Gill Sans', sans-serif">Gill Sans</option>
                    <option value="Helvetica, Arial, sans-serif">Helvetica</option>
                    <option value="'Helvetica Neue', Helvetica, Arial, sans-serif">Helvetica Neue</option>
                    <option value="'Hoefler Text', serif">Hoefler Text</option>
                    <option value="Menlo, monospace">Menlo</option>
                    <option value="'Marker Felt', cursive">Marker Felt</option>
                    <option value="Noteworthy, cursive">Noteworthy</option>
                    <option value="Optima, sans-serif">Optima</option>
                    <option value="Palatino, serif">Palatino</option>
                    <option value="Papyrus, fantasy">Papyrus</option>
                    <option value="'Party LET', cursive">Party LET</option>
                    <option value="'Savoye LET', cursive">Savoye LET</option>
                    <option value="'Snell Roundhand', cursive">Snell Roundhand</option>
                    <option value="'Times New Roman', Times, serif">Times New Roman</option>
                    <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
                    <option value="Verdana, sans-serif">Verdana</option>
                    <option value="Zapfino, cursive">Zapfino</option>
                </select>
            </div>

            <div class="setting-item">
                <label for="fontSize">Size</label>
                <select id="fontSize">
                    <option value="16px">16 px</option>
                    <option value="18px">18 px</option>
                    <option value="20px" selected>20 px</option>
                    <option value="24px">24 px</option>
                    <option value="28px">28 px</option>
                    <option value="32px">32 px</option>
                </select>
            </div>

            <div class="setting-item">
                <label for="lineHeight">Line spacing</label>
                <select id="lineHeight">
                    <option value="1">1.0</option>
                    <option value="1.1">1.1</option>
                    <option value="1.2">1.2</option>
                    <option value="1.3">1.3</option>
                    <option value="1.4">1.4</option>
                    <option value="1.5" selected>1.5</option>
                    <option value="1.6">1.6</option>
                    <option value="1.75">1.75</option>
                    <option value="2">2.0</option>
                </select>
            </div>

            <div class="setting-item">
                <label for="letterSpacing">Letter spacing</label>
                <select id="letterSpacing">
                    <option value="-1px">-1.0 px</option>
                    <option value="-0.5px">-0.5 px</option>
                    <option value="0px" selected>0 px</option>
                    <option value="0.25px">0.25 px</option>
                    <option value="0.5px">0.5 px</option>
                    <option value="0.75px">0.75 px</option>
                    <option value="1px">1.0 px</option>
                    <option value="1.5px">1.5 px</option>
                    <option value="2px">2.0 px</option>
                    <option value="3px">3.0 px</option>
                    <option value="4px">4.0 px</option>
                </select>
            </div>

            <div class="setting-item">
                <label for="textAlign">Align</label>
                <select id="textAlign">
                    <option value="justify" selected>Justify</option>
                    <option value="left">Left</option>
                    <option value="center">Center</option>
                </select>
            </div>

            <div class="setting-item">
                <label for="paddingSide">Side padding</label>
                <select id="paddingSide">
                        <option value="0px">0 px</option>
                        <option value="16px" selected>16 px</option>
                        <option value="25px">25 px</option>
                        <option value="50px">50 px</option>
                        <option value="75px">75 px</option>
                        <option value="100px">100 px</option>
                        <option value="125px">125 px</option>
                        <option value="150px">150 px</option>
                        <option value="175px">175 px</option>
                        <option value="200px">200 px</option>
                        <option value="225px">225 px</option>
                        <option value="250px">250 px</option>
                        <option value="275px">275 px</option>
                        <option value="300px">300 px</option>
                </select>
            </div>

            <div class="setting-item">
                <label for="paddingVertical">Top / bottom</label>
                <select id="paddingVertical">
                        <option value="0px">0 px</option>
                        <option value="16px">16 px</option>
                        <option value="25px">25 px</option>
                        <option value="50px" selected>50 px</option>
                        <option value="75px">75 px</option>
                        <option value="100px">100 px</option>
                        <option value="125px">125 px</option>
                        <option value="150px">150 px</option>
                        <option value="175px">175 px</option>
                        <option value="200px">200 px</option>
                        <option value="225px">225 px</option>
                        <option value="250px">250 px</option>
                        <option value="275px">275 px</option>
                        <option value="300px">300 px</option>
                </select>
            </div>

            <div class="setting-item">
                <label for="textColor">Text</label>
                <input type="color" id="textColor" value="#000000">
            </div>

            <div class="setting-item">
                <label for="bgColor">Background</label>
                <input type="color" id="bgColor" value="#898989">
            </div>

        </div>

        <textarea id="editor" placeholder="Start writing..."></textarea>
    </div>

    <script>
        (function() {
            var editor = document.getElementById('editor');
            var toolbar = document.getElementById('toolbar');
            var toggleBtn = document.getElementById('toggleBtn');

            var fontFamilySelect = document.getElementById('fontFamily');
            var fontSizeSelect = document.getElementById('fontSize');
            var lineHeightSelect = document.getElementById('lineHeight');
            var letterSpacingSelect = document.getElementById('letterSpacing');
            var textAlignSelect = document.getElementById('textAlign');
            var paddingSideSelect = document.getElementById('paddingSide');
            var paddingVerticalSelect = document.getElementById('paddingVertical');
            var textColorInput = document.getElementById('textColor');
            var bgColorInput = document.getElementById('bgColor');

            function loadSettings() {
                var savedText = localStorage.getItem('ipad_note_text_v2');
                var savedFontFamily = localStorage.getItem('ipad_note_font_family');
                var savedFontSize = localStorage.getItem('ipad_note_font_size');
                var savedLineHeight = localStorage.getItem('ipad_note_line_height');
                var savedLetterSpacing = localStorage.getItem('ipad_note_letter_spacing');
                var savedTextAlign = localStorage.getItem('ipad_note_text_align');
                var savedPaddingSide = localStorage.getItem('ipad_note_padding_side');
                var savedPaddingVertical = localStorage.getItem('ipad_note_padding_vertical');
                var savedTextColor = localStorage.getItem('ipad_note_text_color');
                var savedBgColor = localStorage.getItem('ipad_note_bg_color');

                if (savedText !== null) {
                    editor.value = savedText;
                }

                if (savedFontFamily) {
                    fontFamilySelect.value = savedFontFamily;
                    editor.style.fontFamily = savedFontFamily;
                }

                if (savedFontSize) {
                    fontSizeSelect.value = savedFontSize;
                    editor.style.fontSize = savedFontSize;
                }

                if (savedLineHeight) {
                    lineHeightSelect.value = savedLineHeight;
                    editor.style.lineHeight = savedLineHeight;
                }

                if (savedLetterSpacing) {
                    letterSpacingSelect.value = savedLetterSpacing;
                    editor.style.letterSpacing = savedLetterSpacing;
                }

                if (savedTextAlign) {
                    textAlignSelect.value = savedTextAlign;
                    editor.style.textAlign = savedTextAlign;
                }

                if (savedPaddingSide) {
                    paddingSideSelect.value = savedPaddingSide;
                    editor.style.paddingLeft = savedPaddingSide;
                    editor.style.paddingRight = savedPaddingSide;
                }

                if (savedPaddingVertical) {
                    paddingVerticalSelect.value = savedPaddingVertical;
                    editor.style.paddingTop = savedPaddingVertical;
                    editor.style.paddingBottom = savedPaddingVertical;
                }

                if (savedTextColor) {
                    textColorInput.value = savedTextColor;
                    editor.style.color = savedTextColor;
                }

                if (savedBgColor) {
                    bgColorInput.value = savedBgColor;
                    document.body.style.backgroundColor = savedBgColor;
                }
            }

            function saveSettings() {
                localStorage.setItem('ipad_note_text_v2', editor.value);
                localStorage.setItem('ipad_note_font_family', fontFamilySelect.value);
                localStorage.setItem('ipad_note_font_size', fontSizeSelect.value);
                localStorage.setItem('ipad_note_line_height', lineHeightSelect.value);
                localStorage.setItem('ipad_note_letter_spacing', letterSpacingSelect.value);
                localStorage.setItem('ipad_note_text_align', textAlignSelect.value);
                localStorage.setItem('ipad_note_padding_side', paddingSideSelect.value);
                localStorage.setItem('ipad_note_padding_vertical', paddingVerticalSelect.value);
                localStorage.setItem('ipad_note_text_color', textColorInput.value);
                localStorage.setItem('ipad_note_bg_color', bgColorInput.value);
            }

            editor.addEventListener('input', saveSettings);

            fontFamilySelect.addEventListener('change', function() {
                editor.style.fontFamily = this.value;
                saveSettings();
            });

            fontSizeSelect.addEventListener('change', function() {
                editor.style.fontSize = this.value;
                saveSettings();
            });

            lineHeightSelect.addEventListener('change', function() {
                editor.style.lineHeight = this.value;
                saveSettings();
            });

            letterSpacingSelect.addEventListener('change', function() {
                editor.style.letterSpacing = this.value;
                saveSettings();
            });

            textAlignSelect.addEventListener('change', function() {
                editor.style.textAlign = this.value;
                saveSettings();
            });

            paddingSideSelect.addEventListener('change', function() {
                editor.style.paddingLeft = this.value;
                editor.style.paddingRight = this.value;
                saveSettings();
            });

            paddingVerticalSelect.addEventListener('change', function() {
                editor.style.paddingTop = this.value;
                editor.style.paddingBottom = this.value;
                saveSettings();
            });

            textColorInput.addEventListener('change', function() {
                editor.style.color = this.value;
                saveSettings();
            });

            bgColorInput.addEventListener('change', function() {
                document.body.style.backgroundColor = this.value;
                saveSettings();
            });

            toggleBtn.addEventListener('click', function() {
                toolbar.classList.toggle('hidden');
            });

            loadSettings();
        })();
    </script>
</body>
</html>
