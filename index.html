<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>Текст</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background: #f7f4ed;
      color: #222222;
      font-family: Georgia, "Times New Roman", serif;
    }

    #editor {
      position: fixed;
      left: 0;
      top: 0;
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      resize: none;
      border: 0;
      outline: 0;
      margin: 0;
      padding: 7vh 8vw 10vh 8vw;
      background: transparent;
      color: inherit;
      font-family: inherit;
      font-size: 24px;
      line-height: 1.55;
      -webkit-appearance: none;
      -webkit-border-radius: 0;
      caret-color: currentColor;
    }

    #toolbar {
      position: fixed;
      left: 50%;
      top: 14px;
      z-index: 20;
      width: 92%;
      max-width: 760px;
      box-sizing: border-box;
      padding: 10px;
      border-radius: 12px;
      background: rgba(25,25,25,.92);
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      text-align: center;
      -webkit-transform: translate(-50%, -140%);
      transform: translate(-50%, -140%);
      opacity: 0;
      -webkit-transition: opacity .18s ease, -webkit-transform .18s ease;
      transition: opacity .18s ease, transform .18s ease;
      -webkit-user-select: none;
      user-select: none;
    }

    #toolbar.show {
      -webkit-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
      opacity: 1;
    }

    .control {
      display: inline-block;
      vertical-align: middle;
      margin: 4px 5px;
      white-space: nowrap;
    }

    label {
      margin-right: 4px;
      opacity: .8;
    }

    select, input[type="color"] {
      font-size: 16px;
      border: 0;
      border-radius: 7px;
      background: #ffffff;
      color: #111111;
      height: 34px;
      vertical-align: middle;
    }

    select {
      padding: 0 8px;
    }

    input[type="color"] {
      width: 42px;
      padding: 2px;
    }

    #hideBtn {
      border: 0;
      border-radius: 7px;
      background: #ffffff;
      color: #111111;
      height: 34px;
      padding: 0 12px;
      font-size: 16px;
      vertical-align: middle;
    }

    @media (max-width: 600px) {
      #toolbar {
        top: 7px;
        width: 96%;
        padding: 7px 5px;
      }
      .control {
        margin: 3px 2px;
      }
      label {
        display: none;
      }
      #editor {
        padding-left: 6vw;
        padding-right: 6vw;
      }
    }
  </style>
</head>
<body>
  <textarea id="editor"
    autocomplete="off"
    autocorrect="on"
    autocapitalize="sentences"
    spellcheck="true"
    placeholder=""></textarea>

  <div id="toolbar">
    <span class="control">
      <label for="font">Шрифт</label>
      <select id="font">
        <option value='Georgia, "Times New Roman", serif'>Georgia</option>
        <option value='"Times New Roman", Times, serif'>Times</option>
        <option value='-apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif'>System</option>
        <option value='Verdana, Geneva, sans-serif'>Verdana</option>
        <option value='"Trebuchet MS", Arial, sans-serif'>Trebuchet</option>
        <option value='"Courier New", Courier, monospace'>Courier</option>
      </select>
    </span>

    <span class="control">
      <label for="size">Размер</label>
      <select id="size">
        <option value="18">18</option>
        <option value="20">20</option>
        <option value="22">22</option>
        <option value="24" selected>24</option>
        <option value="26">26</option>
        <option value="28">28</option>
        <option value="32">32</option>
        <option value="36">36</option>
        <option value="42">42</option>
        <option value="48">48</option>
      </select>
    </span>

    <span class="control">
      <label for="textColor">Текст</label>
      <input id="textColor" type="color" value="#222222" title="Цвет текста">
    </span>

    <span class="control">
      <label for="bgColor">Фон</label>
      <input id="bgColor" type="color" value="#f7f4ed" title="Цвет фона">
    </span>

    <span class="control">
      <button id="hideBtn" type="button">Скрыть</button>
    </span>
  </div>

  <script>
  (function () {
    var editor = document.getElementById('editor');
    var toolbar = document.getElementById('toolbar');
    var font = document.getElementById('font');
    var size = document.getElementById('size');
    var textColor = document.getElementById('textColor');
    var bgColor = document.getElementById('bgColor');
    var hideBtn = document.getElementById('hideBtn');
    var hideTimer = null;
    var saveTimer = null;

    function get(key, fallback) {
      try {
        var v = localStorage.getItem(key);
        return v === null ? fallback : v;
      } catch (e) {
        return fallback;
      }
    }

    function set(key, value) {
      try {
        localStorage.setItem(key, value);
      } catch (e) {}
    }

    function applySettings() {
      document.body.style.fontFamily = font.value;
      document.body.style.color = textColor.value;
      document.body.style.backgroundColor = bgColor.value;
      editor.style.fontSize = size.value + 'px';

      set('mw_font', font.value);
      set('mw_size', size.value);
      set('mw_text_color', textColor.value);
      set('mw_bg_color', bgColor.value);
    }

    function showToolbar() {
      toolbar.className = 'show';
      if (hideTimer) {
        clearTimeout(hideTimer);
      }
      hideTimer = setTimeout(function () {
        hideToolbar();
      }, 4500);
    }

    function hideToolbar() {
      toolbar.className = '';
      if (hideTimer) {
        clearTimeout(hideTimer);
        hideTimer = null;
      }
    }

    function saveTextSoon() {
      if (saveTimer) {
        clearTimeout(saveTimer);
      }
      saveTimer = setTimeout(function () {
        set('mw_text', editor.value);
      }, 250);
    }

    editor.value = get('mw_text', '');

    var savedFont = get('mw_font', font.value);
    var savedSize = get('mw_size', size.value);
    var savedTextColor = get('mw_text_color', textColor.value);
    var savedBgColor = get('mw_bg_color', bgColor.value);

    font.value = savedFont;
    size.value = savedSize;
    textColor.value = savedTextColor;
    bgColor.value = savedBgColor;
    applySettings();

    font.onchange = applySettings;
    size.onchange = applySettings;
    textColor.onchange = applySettings;
    bgColor.onchange = applySettings;

    editor.oninput = saveTextSoon;
    editor.onkeydown = function () {
      hideToolbar();
    };

    editor.onclick = function () {
      showToolbar();
    };

    editor.ontouchend = function () {
      showToolbar();
    };

    toolbar.onclick = function (e) {
      if (e && e.stopPropagation) {
        e.stopPropagation();
      }
      showToolbar();
    };

    toolbar.ontouchend = function (e) {
      if (e && e.stopPropagation) {
        e.stopPropagation();
      }
    };

    hideBtn.onclick = function (e) {
      if (e && e.stopPropagation) {
        e.stopPropagation();
      }
      hideToolbar();
      editor.focus();
    };

    window.onbeforeunload = function () {
      set('mw_text', editor.value);
    };
  })();
  </script>
</body>
</html>
