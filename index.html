<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>WRITING Заметки</title>
    
    <!-- ИКОНКА ДЛЯ ЭКРАНА «ДОМОЙ» -->
    <link rel="apple-touch-icon" href="logo.png">

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #898989;
            overflow: hidden;
            font-family: -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif;
        }
        .app-container {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -webkit-flex-direction: column;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }
        .toolbar {
            background-color: rgba(40, 40, 40, 0.90);
            color: #ffffff;
            padding: 10px 12px;
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: space-around;
            justify-content: space-around;
            flex-wrap: wrap;
            font-size: 13px;
            z-index: 10;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            transition: max-height 0.3s ease, padding 0.3s ease;
            overflow: hidden;
            max-height: 240px;
        }
        .toolbar.hidden {
            max-height: 0;
            padding: 0 12px;
            border-bottom: none;
        }
        .toolbar-section {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            flex-wrap: wrap;
            margin: 4px 0;
        }
        .setting-item {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            margin: 4px 6px;
        }
        .setting-item label {
            margin-right: 6px;
            font-size: 12px;
            color: #ddd;
        }
        select, input[type="color"] {
            background-color: #333;
            color: #fff;
            border: 1px solid #666;
            border-radius: 4px;
            padding: 4px 6px;
            font-size: 13px;
            outline: none;
        }
        input[type="color"] {
            width: 30px;
            height: 28px;
            padding: 0;
            cursor: pointer;
        }
        .action-btn {
            background-color: #444;
            color: #fff;
            border: 1px solid #777;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 13px;
            margin: 4px 6px;
            cursor: pointer;
        }
        .action-btn:active {
            background-color: #666;
        }
        #fileInput {
            display: none;
        }
        .toggle-btn {
            position: absolute;
            top: 0;
            right: 0;
            z-index: 20;
            background: transparent;
            border: none;
            width: 50px;
            height: 50px;
            cursor: pointer;
            outline: none;
        }
        textarea {
            -webkit-box-flex: 1;
            -webkit-flex: 1;
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            resize: none;
            background-color: transparent;
            color: #000000;
            font-size: 20px;
            line-height: 1.5;
            padding-top: 16px;
            padding-bottom: 16px;
            padding-left: 16px;
            padding-right: 16px;
            font-family: -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif;
            text-align: justify;
            -webkit-appearance: none;
        }
    </style>
</head>
<body>

    <button class="toggle-btn" id="toggleBtn"></button>

    <div class="app-container">
        <div class="toolbar hidden" id="toolbar">
            <div class="toolbar-section">
                <div class="setting-item">
                    <label for="fontFamily">Шрифт:</label>
                    <select id="fontFamily">
                        <option value="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif">Стандартный</option>
                        <option value="Georgia, serif">Georgia (Засечки)</option>
                        <option value="'Courier New', Courier, monospace">Monospace (Код)</option>
                        <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
                        <option value="Verdana, sans-serif">Verdana</option>
                    </select>
                </div>

                <div class="setting-item">
                    <label for="fontSize">Размер:</label>
                    <select id="fontSize">
                        <option value="16px">16 px</option>
                        <option value="18px">18 px</option>
                        <option value="20px" selected>20 px</option>
                        <option value="24px">24 px</option>
                        <option value="28px">28 px</option>
                        <option value="32px">32 px</option>
                    </select>
                </div>

                <div class="setting-item">
                    <label for="textAlign">Выравнивание:</label>
                    <select id="textAlign">
                        <option value="justify" selected>По ширине</option>
                        <option value="left">По левому краю</option>
                        <option value="center">По центру</option>
                    </select>
                </div>

                <div class="setting-item">
                    <label for="paddingSide">Отступы по бокам:</label>
                    <select id="paddingSide">
                        <option value="0px">0 px</option>
                        <option value="16px" selected>16 px</option>
                        <option value="25px">25 px</option>
                        <option value="50px">50 px</option>
                        <option value="75px">75 px</option>
                        <option value="100px">100 px</option>
                        <option value="125px">125 px</option>
                        <option value="150px">150 px</option>
                        <option value="175px">175 px</option>
                        <option value="200px">200 px</option>
                        <option value="225px">225 px</option>
                        <option value="250px">250 px</option>
                        <option value="275px">275 px</option>
                        <option value="300px">300 px</option>
                    </select>
                </div>

                <div class="setting-item">
                    <label for="textColor">Текст:</label>
                    <input type="color" id="textColor" value="#000000">
                </div>

                <div class="setting-item">
                    <label for="bgColor">Фон:</label>
                    <input type="color" id="bgColor" value="#898989">
                </div>
            </div>

            <div class="toolbar-section">
                <button class="action-btn" id="openBtn">📂 Открыть .txt</button>
                <button class="action-btn" id="saveTxtBtn">💾 Сохранить .txt</button>
                <input type="file" id="fileInput" accept=".txt,text/plain">
            </div>
        </div>

        <textarea id="editor" placeholder="Начните писать..."></textarea>
    </div>

    <script>
        (function() {
            var editor = document.getElementById('editor');
            var toolbar = document.getElementById('toolbar');
            var toggleBtn = document.getElementById('toggleBtn');
            var fontFamilySelect = document.getElementById('fontFamily');
            var fontSizeSelect = document.getElementById('fontSize');
            var textAlignSelect = document.getElementById('textAlign');
            var paddingSideSelect = document.getElementById('paddingSide');
            var textColorInput = document.getElementById('textColor');
            var bgColorInput = document.getElementById('bgColor');
            var openBtn = document.getElementById('openBtn');
            var saveTxtBtn = document.getElementById('saveTxtBtn');
            var fileInput = document.getElementById('fileInput');

            function loadSettings() {
                var savedText = localStorage.getItem('ipad_note_text_v2');
                var savedFontFamily = localStorage.getItem('ipad_note_font_family');
                var savedFontSize = localStorage.getItem('ipad_note_font_size');
                var savedTextAlign = localStorage.getItem('ipad_note_text_align');
                var savedPaddingSide = localStorage.getItem('ipad_note_padding_side');
                var savedTextColor = localStorage.getItem('ipad_note_text_color');
                var savedBgColor = localStorage.getItem('ipad_note_bg_color');

                if (savedText !== null) editor.value = savedText;
                
                if (savedFontFamily) {
                    fontFamilySelect.value = savedFontFamily;
                    editor.style.fontFamily = savedFontFamily;
                }
                
                if (savedFontSize) {
                    fontSizeSelect.value = savedFontSize;
                    editor.style.fontSize = savedFontSize;
                }

                if (savedTextAlign) {
                    textAlignSelect.value = savedTextAlign;
                    editor.style.textAlign = savedTextAlign;
                }

                if (savedPaddingSide) {
                    paddingSideSelect.value = savedPaddingSide;
                    editor.style.paddingLeft = savedPaddingSide;
                    editor.style.paddingRight = savedPaddingSide;
                }

                if (savedTextColor) {
                    textColorInput.value = savedTextColor;
                    editor.style.color = savedTextColor;
                }

                if (savedBgColor) {
                    bgColorInput.value = savedBgColor;
                    document.body.style.backgroundColor = savedBgColor;
                }
            }

            function saveSettings() {
                localStorage.setItem('ipad_note_text_v2', editor.value);
                localStorage.setItem('ipad_note_font_family', fontFamilySelect.value);
                localStorage.setItem('ipad_note_font_size', fontSizeSelect.value);
                localStorage.setItem('ipad_note_text_align', textAlignSelect.value);
                localStorage.setItem('ipad_note_padding_side', paddingSideSelect.value);
                localStorage.setItem('ipad_note_text_color', textColorInput.value);
                localStorage.setItem('ipad_note_bg_color', bgColorInput.value);
            }

            editor.addEventListener('input', saveSettings);

            fontFamilySelect.addEventListener('change', function() {
                editor.style.fontFamily = this.value;
                saveSettings();
            });

            fontSizeSelect.addEventListener('change', function() {
                editor.style.fontSize = this.value;
                saveSettings();
            });

            textAlignSelect.addEventListener('change', function() {
                editor.style.textAlign = this.value;
                saveSettings();
            });

            paddingSideSelect.addEventListener('change', function() {
                editor.style.paddingLeft = this.value;
                editor.style.paddingRight = this.value;
                saveSettings();
            });

            textColorInput.addEventListener('change', function() {
                editor.style.color = this.value;
                saveSettings();
            });

            bgColorInput.addEventListener('change', function() {
                document.body.style.backgroundColor = this.value;
                saveSettings();
            });

            openBtn.addEventListener('click', function() {
                fileInput.click();
            });

            fileInput.addEventListener('change', function(e) {
                var file = e.target.files[0];
                if (!file) return;

                var reader = new FileReader();
                reader.onload = function(evt) {
                    editor.value = evt.target.result;
                    saveSettings();
                };
                reader.readAsText(file);
                fileInput.value = '';
            });

            saveTxtBtn.addEventListener('click', function() {
                var text = editor.value;
                var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                var fileName = 'note_' + new Date().toISOString().slice(0, 10) + '.txt';

                if (navigator.msSaveBlob) {
                    navigator.msSaveBlob(blob, fileName);
                } else {
                    var link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    link.download = fileName;
                    link.target = '_blank';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }
            });

            toggleBtn.addEventListener('click', function() {
                toolbar.classList.toggle('hidden');
            });

            loadSettings();
        })();
    </script>
</body>
</html>
