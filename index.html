<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>WRITING Заметки</title>
    
    <!-- ИКОНКИ ДЛЯ ЭКРАНА «ДОМОЙ» И ВКЛАДКИ БРАУЗЕРА -->
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="icon" type="image/png" href="logo.png">

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #898989;
            overflow: hidden;
            font-family: -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif;
        }
        .app-container {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-orient: vertical;
            -webkit-box-direction: normal;
            -webkit-flex-direction: column;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }
        .toolbar {
            background-color: rgba(40, 40, 40, 0.90);
            color: #ffffff;
            padding: 10px 12px;
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            -webkit-justify-content: space-around;
            justify-content: space-around;
            flex-wrap: wrap;
            font-size: 13px;
            z-index: 10;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            transition: max-height 0.3s ease, padding 0.3s ease;
            overflow: hidden;
            max-height: 240px;
        }
        .toolbar.hidden {
            max-height: 0;
            padding: 0 12px;
            border-bottom: none;
        }
        .toolbar-section {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            flex-wrap: wrap;
            margin: 4px 0;
        }
        .setting-item {
            display: -webkit-box;
            display: -webkit-flex;
            display: flex;
            -webkit-box-align: center;
            -webkit-align-items: center;
            align-items: center;
            margin: 4px 6px;
        }
        .setting-item label {
            margin-right: 6px;
            font-size: 12px;
            color: #ddd;
        }
        select, input[type="color"] {
            background-color: #333;
            color: #fff;
            border: 1px solid #666;
            border-radius: 4px;
            padding: 4px 6px;
            font-size: 13px;
            outline: none;
        }
        input[type="color"] {
            width: 30px;
            height: 28px;
            padding: 0;
            cursor: pointer;
        }
        .action-btn {
            background-color: #444;
            color: #fff;
            border: 1px solid #777;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 13px;
            margin: 4px 6px;
            cursor: pointer;
            display: inline-block;
            text-decoration: none;
            text-align: center;
        }
        .action-btn:active {
            background-color: #666;
        }
        /* На старом iOS input[type=file] нельзя прятать через display:none:
           пользователь должен нажимать именно на настоящий input. */
        .file-picker {
            position: relative;
            overflow: hidden;
        }
        #fileInput {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            font-size: 60px;
            cursor: pointer;
            display: block;
        }

        .export-overlay {
            display: none;
            position: fixed;
            left: 0;
            top: 0;
            right: 0;
            bottom: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.72);
            padding: 18px;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }
        .export-overlay.visible {
            display: block;
        }
        .export-box {
            max-width: 720px;
            margin: 20px auto;
            padding: 14px;
            background: #2d2d2d;
            color: #fff;
            border: 1px solid #777;
            border-radius: 6px;
            font-size: 14px;
            line-height: 1.4;
        }
        .export-box p {
            margin: 8px 0 12px 0;
        }
        #exportText {
            width: 100%;
            height: 220px;
            padding: 10px;
            border: 1px solid #777;
            background: #fff;
            color: #000;
            font: 16px/1.4 monospace;
            text-align: left;
            -webkit-user-select: text;
            user-select: text;
        }
        .export-actions {
            margin-top: 10px;
        }
        #exportStatus {
            min-height: 20px;
            color: #ddd;
            margin-top: 8px;
        }
        .toggle-btn {
            position: absolute;
            top: 0;
            right: 0;
            z-index: 20;
            background: transparent;
            border: none;
            width: 50px;
            height: 50px;
            cursor: pointer;
            outline: none;
        }
        textarea {
            -webkit-box-flex: 1;
            -webkit-flex: 1;
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            resize: none;
            background-color: transparent;
            color: #000000;
            font-size: 20px;
            line-height: 1.5;
            padding-top: 16px;
            padding-bottom: 16px;
            padding-left: 16px;
            padding-right: 16px;
            font-family: -apple-system, Helvetica Neue, Helvetica, Arial, sans-serif;
            text-align: justify;
            -webkit-appearance: none;
        }
    </style>
</head>
<body>

    <button class="toggle-btn" id="toggleBtn"></button>

    <div class="app-container">
        <div class="toolbar hidden" id="toolbar">
            <div class="toolbar-section">
                <div class="setting-item">
                    <label for="fontFamily">Шрифт:</label>
                    <select id="fontFamily">
                        <option value="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif">Стандартный</option>
                        <option value="Georgia, serif">Georgia (Засечки)</option>
                        <option value="'Courier New', Courier, monospace">Monospace (Код)</option>
                        <option value="'Trebuchet MS', sans-serif">Trebuchet MS</option>
                        <option value="Verdana, sans-serif">Verdana</option>
                    </select>
                </div>

                <div class="setting-item">
                    <label for="fontSize">Размер:</label>
                    <select id="fontSize">
                        <option value="16px">16 px</option>
                        <option value="18px">18 px</option>
                        <option value="20px" selected>20 px</option>
                        <option value="24px">24 px</option>
                        <option value="28px">28 px</option>
                        <option value="32px">32 px</option>
                    </select>
                </div>

                <div class="setting-item">
                    <label for="textAlign">Выравнивание:</label>
                    <select id="textAlign">
                        <option value="justify" selected>По ширине</option>
                        <option value="left">По левому краю</option>
                        <option value="center">По центру</option>
                    </select>
                </div>

                <div class="setting-item">
                    <label for="paddingSide">Отступы по бокам:</label>
                    <select id="paddingSide">
                        <option value="0px">0 px</option>
                        <option value="16px" selected>16 px</option>
                        <option value="25px">25 px</option>
                        <option value="50px">50 px</option>
                        <option value="75px">75 px</option>
                        <option value="100px">100 px</option>
                        <option value="125px">125 px</option>
                        <option value="150px">150 px</option>
                        <option value="175px">175 px</option>
                        <option value="200px">200 px</option>
                        <option value="225px">225 px</option>
                        <option value="250px">250 px</option>
                        <option value="275px">275 px</option>
                        <option value="300px">300 px</option>
                    </select>
                </div>

                <div class="setting-item">
                    <label for="textColor">Текст:</label>
                    <input type="color" id="textColor" value="#000000">
                </div>

                <div class="setting-item">
                    <label for="bgColor">Фон:</label>
                    <input type="color" id="bgColor" value="#898989">
                </div>
            </div>

            <div class="toolbar-section">
                <!-- Старый iOS: настоящий input расположен поверх кнопки и получает касание напрямую -->
                <span class="action-btn file-picker" id="openBtn">📂 Открыть .txt
                    <input type="file" id="fileInput">
                </span>
                <button class="action-btn" id="saveTxtBtn">💾 Сохранить .txt</button>
            </div>
        </div>

        <textarea id="editor" placeholder="Начните писать..."></textarea>
    </div>

    <!-- Резервный экспорт для iOS 10/старых Safari, где нет нормального скачивания файлов -->
    <div class="export-overlay" id="exportOverlay">
        <div class="export-box">
            <strong>Экспорт текста</strong>
            <p id="exportHelp">На старом iOS прямое сохранение .txt из веб-приложения ограничено. Можно скопировать текст или открыть его отдельной страницей.</p>
            <textarea id="exportText" readonly></textarea>
            <div class="export-actions">
                <button class="action-btn" id="copyExportBtn">📋 Скопировать всё</button>
                <button class="action-btn" id="openExportBtn">↗ Открыть как текст</button>
                <button class="action-btn" id="closeExportBtn">Закрыть</button>
            </div>
            <div id="exportStatus"></div>
        </div>
    </div>

    <script>
        (function() {
            var editor = document.getElementById('editor');
            var toolbar = document.getElementById('toolbar');
            var toggleBtn = document.getElementById('toggleBtn');
            var fontFamilySelect = document.getElementById('fontFamily');
            var fontSizeSelect = document.getElementById('fontSize');
            var textAlignSelect = document.getElementById('textAlign');
            var paddingSideSelect = document.getElementById('paddingSide');
            var textColorInput = document.getElementById('textColor');
            var bgColorInput = document.getElementById('bgColor');
            var saveTxtBtn = document.getElementById('saveTxtBtn');
            var fileInput = document.getElementById('fileInput');
            var exportOverlay = document.getElementById('exportOverlay');
            var exportText = document.getElementById('exportText');
            var exportHelp = document.getElementById('exportHelp');
            var exportStatus = document.getElementById('exportStatus');
            var copyExportBtn = document.getElementById('copyExportBtn');
            var openExportBtn = document.getElementById('openExportBtn');
            var closeExportBtn = document.getElementById('closeExportBtn');
            var pendingExportText = '';
            var pendingExportName = '';

            function loadSettings() {
                var savedText = localStorage.getItem('ipad_note_text_v2');
                var savedFontFamily = localStorage.getItem('ipad_note_font_family');
                var savedFontSize = localStorage.getItem('ipad_note_font_size');
                var savedTextAlign = localStorage.getItem('ipad_note_text_align');
                var savedPaddingSide = localStorage.getItem('ipad_note_padding_side');
                var savedTextColor = localStorage.getItem('ipad_note_text_color');
                var savedBgColor = localStorage.getItem('ipad_note_bg_color');

                if (savedText !== null) editor.value = savedText;
                
                if (savedFontFamily) {
                    fontFamilySelect.value = savedFontFamily;
                    editor.style.fontFamily = savedFontFamily;
                }
                
                if (savedFontSize) {
                    fontSizeSelect.value = savedFontSize;
                    editor.style.fontSize = savedFontSize;
                }

                if (savedTextAlign) {
                    textAlignSelect.value = savedTextAlign;
                    editor.style.textAlign = savedTextAlign;
                }

                if (savedPaddingSide) {
                    paddingSideSelect.value = savedPaddingSide;
                    editor.style.paddingLeft = savedPaddingSide;
                    editor.style.paddingRight = savedPaddingSide;
                }

                if (savedTextColor) {
                    textColorInput.value = savedTextColor;
                    editor.style.color = savedTextColor;
                }

                if (savedBgColor) {
                    bgColorInput.value = savedBgColor;
                    document.body.style.backgroundColor = savedBgColor;
                }
            }

            function saveSettings() {
                localStorage.setItem('ipad_note_text_v2', editor.value);
                localStorage.setItem('ipad_note_font_family', fontFamilySelect.value);
                localStorage.setItem('ipad_note_font_size', fontSizeSelect.value);
                localStorage.setItem('ipad_note_text_align', textAlignSelect.value);
                localStorage.setItem('ipad_note_padding_side', paddingSideSelect.value);
                localStorage.setItem('ipad_note_text_color', textColorInput.value);
                localStorage.setItem('ipad_note_bg_color', bgColorInput.value);
            }

            editor.addEventListener('input', saveSettings);

            fontFamilySelect.addEventListener('change', function() {
                editor.style.fontFamily = this.value;
                saveSettings();
            });

            fontSizeSelect.addEventListener('change', function() {
                editor.style.fontSize = this.value;
                saveSettings();
            });

            textAlignSelect.addEventListener('change', function() {
                editor.style.textAlign = this.value;
                saveSettings();
            });

            paddingSideSelect.addEventListener('change', function() {
                editor.style.paddingLeft = this.value;
                editor.style.paddingRight = this.value;
                saveSettings();
            });

            textColorInput.addEventListener('change', function() {
                editor.style.color = this.value;
                saveSettings();
            });

            bgColorInput.addEventListener('change', function() {
                document.body.style.backgroundColor = this.value;
                saveSettings();
            });

            // Определяем старый iOS. iPad 4 (A1458) работает на ветке iOS 10.
            function getIOSMajorVersion() {
                var ua = navigator.userAgent || '';
                var match = ua.match(/OS (\d+)[_\.]/);
                if (/iPad|iPhone|iPod/.test(ua) && match) {
                    return parseInt(match[1], 10);
                }
                return 0;
            }

            function isOldIOS() {
                var version = getIOSMajorVersion();
                return version > 0 && version < 13;
            }

            function makeFileName() {
                var d = new Date();
                var year = d.getFullYear();
                var month = ('0' + (d.getMonth() + 1)).slice(-2);
                var day = ('0' + d.getDate()).slice(-2);
                return 'note_' + year + '-' + month + '-' + day + '.txt';
            }

            function showExportFallback(text, fileName) {
                pendingExportText = text;
                pendingExportName = fileName;
                exportText.value = text;
                exportStatus.innerHTML = 'Имя файла: <b>' + fileName + '</b>';

                if (isOldIOS()) {
                    exportHelp.innerHTML = 'На iOS 10 прямое скачивание .txt из приложения с экрана «Домой» не поддерживается. Текст уже сохранён внутри приложения. Для переноса наружу используйте «Скопировать всё» или «Открыть как текст».';
                } else {
                    exportHelp.innerHTML = 'Браузер не смог скачать файл автоматически. Используйте один из резервных способов ниже.';
                }
                exportOverlay.className = 'export-overlay visible';
            }

            function hideExportFallback() {
                exportOverlay.className = 'export-overlay';
                exportStatus.innerHTML = '';
            }

            // Обработка загрузки файла. Настоящий input получает касание напрямую — это важно для старого iOS.
            fileInput.addEventListener('change', function(e) {
                var files = e.target.files;
                var file = files && files.length ? files[0] : null;
                if (!file) return;

                if (typeof FileReader === 'undefined') {
                    alert('Этот браузер не умеет читать выбранные файлы.');
                    return;
                }

                var reader = new FileReader();
                reader.onload = function(evt) {
                    editor.value = evt.target.result || '';
                    saveSettings();
                    fileInput.value = '';
                };
                reader.onerror = function() {
                    alert('Не удалось открыть файл. Попробуйте другой .txt файл.');
                    fileInput.value = '';
                };
                reader.readAsText(file, 'UTF-8');
            });

            // Сохранение без async/await — синтаксис совместим со старым Safari.
            saveTxtBtn.addEventListener('click', function(e) {
                e.preventDefault();
                var text = editor.value;
                var fileName = makeFileName();

                // Текст в любом случае сохраняется локально в приложении.
                saveSettings();

                // iOS 10–12: download/Web Share для файла ненадёжны или отсутствуют.
                if (isOldIOS()) {
                    showExportFallback(text, fileName);
                    return;
                }

                var blob;
                try {
                    blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
                } catch (blobError) {
                    showExportFallback(text, fileName);
                    return;
                }

                // Новые iOS: сначала пробуем системное «Поделиться» с файлом.
                if (navigator.share && navigator.canShare && typeof File !== 'undefined') {
                    try {
                        var shareFile = new File([blob], fileName, { type: 'text/plain' });
                        if (navigator.canShare({ files: [shareFile] })) {
                            navigator.share({
                                files: [shareFile],
                                title: fileName
                            }).then(function() {
                                // Пользователь завершил системное меню.
                            }).catch(function() {
                                downloadBlobOrFallback(blob, text, fileName);
                            });
                            return;
                        }
                    } catch (shareError) {
                        // Переходим к обычному скачиванию.
                    }
                }

                downloadBlobOrFallback(blob, text, fileName);
            });

            function downloadBlobOrFallback(blob, text, fileName) {
                var a = document.createElement('a');
                if (!('download' in a) || !window.URL || !URL.createObjectURL) {
                    showExportFallback(text, fileName);
                    return;
                }

                var url = URL.createObjectURL(blob);
                a.href = url;
                a.download = fileName;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();

                setTimeout(function() {
                    if (a.parentNode) a.parentNode.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 1500);
            }

            copyExportBtn.addEventListener('click', function() {
                exportText.focus();
                exportText.select();
                try {
                    var ok = document.execCommand && document.execCommand('copy');
                    exportStatus.innerHTML = ok ? 'Текст скопирован. Теперь его можно вставить в Почту, Заметки или другое приложение.' : 'Текст выделен. Нажмите «Копировать» во всплывающем меню iOS.';
                } catch (err) {
                    exportStatus.innerHTML = 'Текст выделен. Нажмите «Копировать» во всплывающем меню iOS.';
                }
            });

            openExportBtn.addEventListener('click', function() {
                var dataUrl = 'data:text/plain;charset=utf-8,' + encodeURIComponent(pendingExportText);
                var opened = null;
                try {
                    opened = window.open(dataUrl, '_blank');
                } catch (err) {
                    opened = null;
                }

                if (!opened) {
                    // Перед уходом текст уже сохранён в localStorage.
                    try {
                        window.location.href = dataUrl;
                    } catch (err2) {
                        exportText.focus();
                        exportText.select();
                        exportStatus.innerHTML = 'Не удалось открыть отдельную страницу. Текст выделен для ручного копирования.';
                    }
                }
            });

            closeExportBtn.addEventListener('click', function() {
                hideExportFallback();
            });

            toggleBtn.addEventListener('click', function() {
                toolbar.classList.toggle('hidden');
            });

            loadSettings();
        })();
    </script>
</body>
</html>
